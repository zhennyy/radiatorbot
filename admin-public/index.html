<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RadiatorPro — админка</title>
<style>
  :root {
    --bg: #f4f2ee; --surface: #ffffff; --ink: #1c1a17; --ink-dim: #706a5f;
    --line: #e2ddd3; --brass: #a9762a; --brass-bg: #f7ecd9;
    --good: #2f7d4f; --bad: #b0392c; --radius: 8px;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--ink); margin: 0; padding: 32px 20px 60px;
  }
  .wrap { max-width: 920px; margin: 0 auto; }
  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 24px; flex-wrap: wrap; gap: 8px; }
  header h1 { font-size: 22px; margin: 0; }
  header h1 span { color: var(--brass); }
  header .sub { color: var(--ink-dim); font-size: 13px; }
  header .head-right { display: flex; align-items: center; gap: 12px; }
  .lang-switch { display: inline-flex; border: 1px solid var(--line); border-radius: 20px; overflow: hidden; }
  .lang-switch button {
    border: none; background: #fff; color: var(--ink-dim); padding: 5px 12px; font-size: 12.5px;
    font-weight: 600; cursor: pointer;
  }
  .lang-switch button.active { background: var(--brass); color: #fff; }
  .tabs { display: flex; gap: 6px; margin-bottom: 20px; border-bottom: 1px solid var(--line); }
  .tabs button {
    border: none; background: none; padding: 10px 4px; margin-right: 18px; font-size: 14.5px;
    color: var(--ink-dim); cursor: pointer; border-bottom: 2px solid transparent; font-weight: 600;
  }
  .tabs button.active { color: var(--ink); border-color: var(--brass); }
  .tab-content { display: none; }
  .tab-content.active { display: block; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; margin-bottom: 20px; }
  .card h2 { font-size: 15px; margin: 0 0 14px; color: var(--ink-dim); font-weight: 600; letter-spacing: .02em; text-transform: uppercase; }
  .stat-row { display: flex; flex-wrap: wrap; gap: 12px; }
  .stat-tile { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; min-width: 130px; flex: 1; }
  .stat-num { font-size: 22px; font-weight: 700; color: var(--brass); }
  .stat-label { font-size: 12.5px; color: var(--ink-dim); margin-top: 2px; }
  .form-row { display: flex; gap: 8px; flex-wrap: wrap; }
  input, select {
    padding: 9px 10px; border: 1px solid var(--line); border-radius: 6px; font-size: 14px; background: #fff; color: var(--ink);
  }
  input[type="number"] { width: 100px; }
  #p-name { flex: 1; min-width: 160px; }
  #p-category { width: 140px; }
  button.primary {
    background: var(--brass); color: #fff; border: none; border-radius: 6px; padding: 9px 16px;
    font-size: 14px; font-weight: 600; cursor: pointer;
  }
  button.primary:hover { opacity: .9; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line); }
  th { color: var(--ink-dim); font-weight: 600; font-size: 12.5px; text-transform: uppercase; letter-spacing: .03em; }
  td input[type="number"] { width: 70px; padding: 5px 6px; }
  .row-actions button { border: 1px solid var(--line); background: #fff; border-radius: 5px; padding: 5px 9px; font-size: 12.5px; cursor: pointer; margin-right: 4px; }
  .row-actions button:hover { border-color: var(--brass); color: var(--brass); }
  .row-actions button.danger:hover { border-color: var(--bad); color: var(--bad); }
  .status-pill {
    display: inline-block; padding: 2px 9px; border-radius: 20px; font-size: 12px; font-weight: 600;
  }
  .status-pending { background: #f2e9d8; color: #8a6a1e; }
  .status-paid, .status-awaiting_payment { background: #e6f0e9; color: var(--good); }
  .status-shipped { background: #e4edf6; color: #2f5c8a; }
  .status-delivered { background: #e9e9e9; color: #555; }
  .empty { color: var(--ink-dim); font-size: 13.5px; padding: 12px 0; }
  .thumb { width: 40px; height: 40px; object-fit: cover; border-radius: 5px; border: 1px solid var(--line); background: var(--bg); display: block; }
  .thumb-placeholder { width: 40px; height: 40px; border-radius: 5px; border: 1px dashed var(--line); background: var(--bg); }
  td input[type="text"].photo-input { width: 160px; padding: 5px 6px; font-size: 12.5px; }

  /* --- полировка --- */
  a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible {
    outline: 2px solid var(--brass); outline-offset: 1px;
  }
  .tabs {
    position: sticky; top: 0; z-index: 10; background: var(--bg);
    padding-top: 4px; flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs button { white-space: nowrap; transition: color .15s, border-color .15s; }
  .card { transition: box-shadow .15s; }
  .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0 -4px; padding: 0 4px; }
  table tr:hover td { background: var(--bg); }
  tr.order-row { cursor: pointer; }
  tr td, tr th { transition: background .1s; }
  button.primary { transition: opacity .15s, transform .05s; }
  button.primary:active { transform: scale(.98); }
  .row-actions button, button[type="button"]:not(.primary) {
    transition: border-color .15s, color .15s;
  }
  #toast-stack {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    display: flex; flex-direction: column; gap: 8px; z-index: 100; pointer-events: none;
  }
  .toast {
    background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 7px;
    font-size: 13.5px; box-shadow: 0 4px 16px rgba(0,0,0,.18);
    opacity: 0; transform: translateY(8px); transition: opacity .2s, transform .2s;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.error { background: var(--bad); }
  .toast.ok { background: var(--good); }

  #order-modal-backdrop {
    display: none; position: fixed; inset: 0; background: rgba(28,26,23,.45);
    z-index: 200; align-items: center; justify-content: center; padding: 20px;
  }
  #order-modal-backdrop.show { display: flex; }
  #order-modal {
    background: var(--surface); border-radius: var(--radius); max-width: 480px; width: 100%;
    max-height: 85vh; overflow-y: auto; padding: 22px 24px; box-shadow: 0 12px 40px rgba(0,0,0,.25);
  }
  #order-modal h3 { margin: 0 0 4px; font-size: 17px; }
  #order-modal .om-sub { color: var(--ink-dim); font-size: 12.5px; margin-bottom: 16px; }
  #order-modal .om-row { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  #order-modal .om-row:last-of-type { border-bottom: none; }
  #order-modal .om-label { color: var(--ink-dim); }
  #order-modal .om-items { margin: 10px 0; padding: 10px 12px; background: var(--bg); border-radius: 6px; }
  #order-modal .om-items div { padding: 3px 0; font-size: 13.5px; display: flex; justify-content: space-between; gap: 10px; }
  #order-modal .om-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
  #order-modal .om-close { float: right; border: none; background: none; font-size: 18px; cursor: pointer; color: var(--ink-dim); line-height: 1; }
  #order-modal .om-close:hover { color: var(--ink); }

  @media (max-width: 640px) {
    body { padding: 20px 12px 60px; }
    .card { padding: 14px 14px; }
    .form-row { gap: 6px; }
    input, select, button { font-size: 13.5px; }
    header h1 { font-size: 19px; }
    .stat-tile { min-width: 46%; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Radiator<span>Pro</span> <span data-i18n="titleSuffix">— админка</span></h1>
    <div class="head-right">
      <div class="lang-switch">
        <button id="lang-btn-ru" onclick="setAdminLang('ru')">RU</button>
        <button id="lang-btn-en" onclick="setAdminLang('en')">EN</button>
      </div>
      <span class="sub" id="clock"></span>
    </div>
  </header>

  <div class="tabs">
    <button id="tab-btn-products" class="active" data-i18n="tabProducts" onclick="showTab('products')">Товары</button>
    <button id="tab-btn-orders" data-i18n="tabOrders" onclick="showTab('orders')">Заказы</button>
    <button id="tab-btn-promos" data-i18n="tabPromos" onclick="showTab('promos')">Промокоды</button>
    <button id="tab-btn-delivery" data-i18n="tabDelivery" onclick="showTab('delivery')">Доставка</button>
    <button id="tab-btn-analytics" data-i18n="tabAnalytics" onclick="showTab('analytics')">Аналитика</button>
  </div>

  <div id="products" class="tab-content active">
    <div class="card">
      <h2 data-i18n="addProductHeader">Добавить товар</h2>
      <div class="form-row">
        <input id="p-name" data-i18n-ph="phName" placeholder="Название">
        <input id="p-price" data-i18n-ph="phPrice" placeholder="Цена, ₽" type="number">
        <input id="p-stock" data-i18n-ph="phStock" placeholder="Остаток" type="number">
        <input id="p-category" data-i18n-ph="phCategory" placeholder="Категория">
        <input id="p-photo" data-i18n-ph="phPhoto" placeholder="Ссылка на фото (URL) или загрузите файл" style="flex: 1; min-width: 200px;">
        <input type="file" id="p-photo-file" accept="image/*" style="display:none" onchange="uploadNewProductPhoto(this.files[0])">
        <button type="button" data-i18n="btnUploadFromComputer" onclick="document.getElementById('p-photo-file').click()">📷 Загрузить с компьютера</button>
        <button class="primary" data-i18n="btnAdd" onclick="addProduct()">Добавить</button>
      </div>
      <div class="form-row" style="margin-top: 8px;">
        <input id="p-name-en" data-i18n-ph="phNameEn" placeholder="Название на англ. (необязательно)" style="flex: 1; min-width: 160px;">
        <input id="p-category-en" data-i18n-ph="phCategoryEn" placeholder="Категория на англ. (необязательно)" style="width: 180px;">
      </div>
      <p class="empty" id="p-photo-status"></p>
    </div>
    <div class="card">
      <h2 data-i18n="catalogHeader">Каталог</h2>
      <div class="table-wrap"><table id="products-table"></table></div>
    </div>
  </div>

  <div id="orders" class="tab-content">
    <div class="card">
      <h2 data-i18n="ordersHeader">Заказы</h2>
      <div class="form-row" style="margin-bottom: 14px;">
        <select id="o-status" onchange="loadOrders()">
          <option value="" data-i18n="optAllStatuses">Все статусы</option>
          <option value="pending" data-i18n="optPending">Ожидает</option>
          <option value="awaiting_payment" data-i18n="optAwaitingPayment">Ожидает оплаты</option>
          <option value="paid" data-i18n="optPaid">Оплачен</option>
          <option value="shipped" data-i18n="optShipped">Отправлен</option>
          <option value="delivered" data-i18n="optDelivered">Доставлен</option>
          <option value="cancelled" data-i18n="optCancelled">Отменён</option>
        </select>
        <input id="o-search" data-i18n-ph="phSearch" placeholder="Поиск: № заказа, код, адрес, chat ID" style="flex: 1; min-width: 200px;" oninput="debounceLoadOrders()">
        <button type="button" data-i18n="btnDownloadCsv" onclick="exportOrdersCsv()">⬇️ Скачать CSV</button>
      </div>
      <div class="table-wrap"><table id="orders-table"></table></div>
    </div>
  </div>

  <div id="analytics" class="tab-content">
    <div class="card">
      <h2 data-i18n="revenueHeader">Выручка (оплаченные заказы)</h2>
      <div class="stat-row">
        <div class="stat-tile"><div class="stat-num" id="an-revenue-today">—</div><div class="stat-label" data-i18n="statToday">Сегодня</div></div>
        <div class="stat-tile"><div class="stat-num" id="an-revenue-week">—</div><div class="stat-label" data-i18n="stat7d">7 дней</div></div>
        <div class="stat-tile"><div class="stat-num" id="an-revenue-month">—</div><div class="stat-label" data-i18n="stat30d">30 дней</div></div>
        <div class="stat-tile"><div class="stat-num" id="an-avg">—</div><div class="stat-label" data-i18n="statAvg">Средний чек</div></div>
      </div>
      <p class="empty" id="an-orders-count"></p>
    </div>
    <div class="card">
      <h2 data-i18n="topProductsHeader">Топ товаров (по количеству продаж)</h2>
      <div class="table-wrap"><table id="analytics-top-table"></table></div>
    </div>
  </div>

  <div id="promos" class="tab-content">
    <div class="card">
      <h2 data-i18n="addPromoHeader">Добавить промокод</h2>
      <div class="form-row">
        <input id="pr-code" data-i18n-ph="phPromoCode" placeholder="Код (например SALE10)" style="width: 160px;">
        <input id="pr-percent" data-i18n-ph="phPromoPercent" placeholder="Скидка, %" type="number" min="1" max="99">
        <input id="pr-max" data-i18n-ph="phPromoMax" placeholder="Лимит использований (опц.)" type="number" min="1">
        <button class="primary" data-i18n="btnAdd" onclick="addPromo()">Добавить</button>
      </div>
    </div>
    <div class="card">
      <h2 data-i18n="promosHeader">Промокоды</h2>
      <div class="table-wrap"><table id="promos-table"></table></div>
    </div>
  </div>

  <div id="delivery" class="tab-content">
    <div class="card">
      <h2 data-i18n="addDeliveryHeader">Добавить/изменить тариф</h2>
      <div class="form-row">
        <input id="dl-city" data-i18n-ph="phCity" placeholder="Город" style="width: 200px;">
        <input id="dl-city-en" data-i18n-ph="phCityEn" placeholder="Город на англ. (необязательно)" style="width: 200px;">
        <input id="dl-price" data-i18n-ph="phPrice" placeholder="Цена, ₽" type="number" min="0">
        <button class="primary" data-i18n="btnSave" onclick="addDelivery()">Сохранить</button>
      </div>
    </div>
    <div class="card">
      <h2 data-i18n="deliveryRatesHeader">Тарифы доставки</h2>
      <p class="empty" id="delivery-default"></p>
      <div class="table-wrap"><table id="delivery-table"></table></div>
    </div>
  </div>
</div>

<div id="toast-stack"></div>

<div id="order-modal-backdrop" onclick="if (event.target === this) closeOrderDetail()">
  <div id="order-modal">
    <div id="order-modal-body">Загрузка…</div>
  </div>
</div>

let ADMIN_LANG = 'ru';
try { ADMIN_LANG = localStorage.getItem('adminLang') || 'ru'; } catch {}

function a(key, ...args) {
  const dict = ADMIN_STRINGS[ADMIN_LANG] || ADMIN_STRINGS.ru;
  let entry = dict[key];
  if (entry === undefined) entry = ADMIN_STRINGS.ru[key];
  if (typeof entry === 'function') return entry(...args);
  return entry;
}

function applyStaticI18n() {
  document.querySelectorAll('[data-i18n]').forEach((el) => {
    el.textContent = a(el.getAttribute('data-i18n'));
  });
  document.querySelectorAll('[data-i18n-ph]').forEach((el) => {
    el.setAttribute('placeholder', a(el.getAttribute('data-i18n-ph')));
  });
  document.getElementById('lang-btn-ru').classList.toggle('active', ADMIN_LANG === 'ru');
  document.getElementById('lang-btn-en').classList.toggle('active', ADMIN_LANG === 'en');
  document.documentElement.lang = ADMIN_LANG;
}

function setAdminLang(lang) {
  ADMIN_LANG = lang;
  try { localStorage.setItem('adminLang', lang); } catch {}
  applyStaticI18n();
  tickClock();
  // перерисовываем содержимое активной вкладки на новом языке
  const activeTab = document.querySelector('.tab-content.active');
  if (activeTab) TAB_LOADERS[activeTab.id]();
}

function toast(message, type) {
  const stack = document.getElementById('toast-stack');
  if (!stack) { alert(message); return; }
  const el = document.createElement('div');
  el.className = 'toast' + (type ? ' ' + type : '');
  el.textContent = message;
  stack.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => {
    el.classList.remove('show');
    setTimeout(() => el.remove(), 250);
  }, 3200);
}

const TAB_LOADERS = {
  products: loadProducts,
  orders: loadOrders,
  promos: loadPromos,
  delivery: loadDelivery,
  analytics: loadAnalytics,
};

let ordersSearchTimer = null;
function debounceLoadOrders() {
  clearTimeout(ordersSearchTimer);
  ordersSearchTimer = setTimeout(loadOrders, 300);
}

function showTab(id) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tabs button').forEach(el => el.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.getElementById('tab-btn-' + id).classList.add('active');
  TAB_LOADERS[id]();
}

function money(kopecks) { return (kopecks / 100).toFixed(0) + ' ₽'; }

async function loadProducts() {
  const table0 = document.getElementById('products-table');
  if (table0) table0.innerHTML = `<tr><td class="empty">${a('loading')}</td></tr>`;
  const products = await fetch('/api/products').then(r => r.json());
  const table = document.getElementById('products-table');
  if (!products.length) { table.innerHTML = `<tr><td class="empty">${a('catalogEmpty')}</td></tr>`; return; }
  table.innerHTML = `<tr><th>${a('thPhoto')}</th><th>${a('thId')}</th><th>${a('thName')}</th><th>${a('thCategory')}</th><th>${a('thPrice')}</th><th>${a('thStock')}</th><th></th></tr>` +
    products.map(p => `<tr>
      <td>${p.photo_url ? `<img class="thumb" src="${p.photo_url}" alt="">` : `<span class="thumb-placeholder"></span>`}</td>
      <td>${p.id}</td>
      <td>${ADMIN_LANG === 'en' && p.name_en ? `${p.name_en}<div class="empty" style="margin:0;">RU: ${p.name}</div>` : `${p.name}${p.name_en ? `<div class="empty" style="margin:0;">EN: ${p.name_en}</div>` : ''}`}</td>
      <td>${ADMIN_LANG === 'en' && p.category_en ? `${p.category_en}<div class="empty" style="margin:0;">RU: ${p.category || '—'}</div>` : `${p.category || '—'}${p.category_en ? `<div class="empty" style="margin:0;">EN: ${p.category_en}</div>` : ''}`}</td>
      <td>${money(p.price)}</td>
      <td><input type="number" value="${p.stock}" onchange="updateStock(${p.id}, this.value)"></td>
      <td class="row-actions">
        <button onclick="editPhoto(${p.id}, '${(p.photo_url || '').replace(/'/g, "\\'")}')">${a('btnLink')}</button>
        <input type="file" accept="image/*" style="display:none" id="file-${p.id}" onchange="uploadProductPhoto(${p.id}, this.files[0])">
        <button onclick="document.getElementById('file-${p.id}').click()">${a('btnUpload')}</button>
        <button onclick="editEnglish(${p.id}, '${(p.name_en || '').replace(/'/g, "\\'")}', '${(p.category_en || '').replace(/'/g, "\\'")}')">${a('btnEnglish')}</button>
        <button class="danger" onclick="deleteProduct(${p.id})">${a('btnDelete')}</button>
      </td>
    </tr>`).join('');
}

async function uploadPhotoFile(file) {
  const body = new FormData();
  body.append('photo', file);
  const res = await fetch('/api/upload', { method: 'POST', body });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || a('uploadFailed'));
  return data.url;
}

async function uploadNewProductPhoto(file) {
  if (!file) return;
  const status = document.getElementById('p-photo-status');
  status.textContent = a('uploadingText');
  try {
    const url = await uploadPhotoFile(file);
    document.getElementById('p-photo').value = url;
    status.textContent = a('uploadedText');
  } catch (err) {
    status.textContent = err.message;
  }
}

async function uploadProductPhoto(id, file) {
  if (!file) return;
  try {
    const url = await uploadPhotoFile(file);
    const products = await fetch('/api/products').then(r => r.json());
    const p = products.find(p => p.id === id);
    if (!p) return;
    await fetch(`/api/products/${id}`, {
      method: 'PUT', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ...p, price: p.price / 100, photo_url: url }),
    });
    loadProducts();
  } catch (err) {
    toast(err.message, 'error');
  }
}

async function addProduct() {
  const name = document.getElementById('p-name').value.trim();
  const price = parseFloat(document.getElementById('p-price').value);
  if (!name || !price) return toast(a('toastNameAndPrice'), 'error');
  const body = {
    name,
    price,
    stock: parseInt(document.getElementById('p-stock').value) || 0,
    category: document.getElementById('p-category').value.trim(),
    photo_url: document.getElementById('p-photo').value.trim(),
    name_en: document.getElementById('p-name-en').value.trim(),
    category_en: document.getElementById('p-category-en').value.trim(),
  };
  await fetch('/api/products', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  document.getElementById('p-name').value = '';
  document.getElementById('p-price').value = '';
  document.getElementById('p-stock').value = '';
  document.getElementById('p-category').value = '';
  document.getElementById('p-photo').value = '';
  document.getElementById('p-name-en').value = '';
  document.getElementById('p-category-en').value = '';
  document.getElementById('p-photo-status').textContent = '';
  loadProducts();
}

async function updateStock(id, stock) {
  const products = await fetch('/api/products').then(r => r.json());
  const p = products.find(p => p.id === id);
  if (!p) return;
  await fetch(`/api/products/${id}`, {
    method: 'PUT', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ ...p, price: p.price / 100, stock: parseInt(stock) }),
  });
  loadProducts();
}

async function editPhoto(id, currentUrl) {
  const url = prompt(a('promptPhotoUrl'), currentUrl || '');
  if (url === null) return;
  const products = await fetch('/api/products').then(r => r.json());
  const p = products.find(p => p.id === id);
  if (!p) return;
  await fetch(`/api/products/${id}`, {
    method: 'PUT', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ ...p, price: p.price / 100, photo_url: url.trim() }),
  });
  loadProducts();
}

async function editEnglish(id, currentNameEn, currentCategoryEn) {
  const nameEn = prompt(a('promptNameEn'), currentNameEn || '');
  if (nameEn === null) return;
  const categoryEn = prompt(a('promptCategoryEn'), currentCategoryEn || '');
  if (categoryEn === null) return;
  const products = await fetch('/api/products').then(r => r.json());
  const p = products.find(p => p.id === id);
  if (!p) return;
  await fetch(`/api/products/${id}`, {
    method: 'PUT', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ ...p, price: p.price / 100, name_en: nameEn.trim(), category_en: categoryEn.trim() }),
  });
  toast(a('toastEnglishSaved'), 'ok');
  loadProducts();
}

async function deleteProduct(id) {
  if (!confirm(a('confirmDeleteProduct', id))) return;
  await fetch(`/api/products/${id}`, { method: 'DELETE' });
  loadProducts();
}

async function loadOrders() {
  const status = document.getElementById('o-status')?.value || '';
  const q = document.getElementById('o-search')?.value || '';
  const params = new URLSearchParams();
  if (status) params.set('status', status);
  if (q.trim()) params.set('q', q.trim());
  const table0 = document.getElementById('orders-table');
  if (table0) table0.innerHTML = `<tr><td class="empty">${a('loading')}</td></tr>`;
  const orders = await fetch('/api/orders?' + params.toString()).then(r => r.json());
  const table = document.getElementById('orders-table');
  if (!orders.length) { table.innerHTML = `<tr><td class="empty">${a('ordersEmpty')}</td></tr>`; return; }
  table.innerHTML = `<tr><th>${a('thId')}</th><th>${a('thStatus')}</th><th>${a('thSum')}</th><th>${a('thComposition')}</th><th>${a('thAddress')}</th><th></th></tr>` +
    orders.map(o => {
      const st = (o.status || '').split(':')[0];
      const label = a('STATUS_LABEL')[st] || st;
      return `<tr class="order-row" onclick="openOrderDetail(${o.id})">
        <td>#${o.id}${o.order_code ? `<div class="empty" style="margin:0;">${o.order_code}</div>` : ''}</td>
        <td><span class="status-pill status-${st}">${label}</span></td>
        <td>${money(o.total)}</td>
        <td>${o.items.map(i => `${(ADMIN_LANG === 'en' && i.name_en) || i.name} ×${i.quantity}`).join(', ')}</td>
        <td>${escH(o.address || '—')}</td>
        <td class="row-actions" onclick="event.stopPropagation()">
          <button onclick="setStatus(${o.id}, 'shipped')">${a('btnShipped')}</button>
          <button onclick="setStatus(${o.id}, 'delivered')">${a('btnDelivered')}</button>
        </td>
      </tr>`;
    }).join('');
}

function exportOrdersCsv() {
  const status = document.getElementById('o-status')?.value || '';
  const q = document.getElementById('o-search')?.value || '';
  const params = new URLSearchParams();
  if (status) params.set('status', status);
  if (q.trim()) params.set('q', q.trim());
  const a = document.createElement('a');
  a.href = '/api/orders/export?' + params.toString();
  a.download = '';
  document.body.appendChild(a);
  a.click();
  a.remove();
}

async function openOrderDetail(id) {
  const backdrop = document.getElementById('order-modal-backdrop');
  const body = document.getElementById('order-modal-body');
  body.innerHTML = a('loading');
  backdrop.classList.add('show');
  let o;
  try {
    const res = await fetch(`/api/orders/${id}`);
    if (!res.ok) throw new Error('not found');
    o = await res.json();
  } catch {
    body.innerHTML = `<button class="om-close" onclick="closeOrderDetail()">✕</button><p class="empty">${a('orderNotFound')}</p>`;
    return;
  }
  const st = (o.status || '').split(':')[0];
  const label = a('STATUS_LABEL')[st] || st;
  const itemsHtml = o.items.map(i => `<div><span>${(ADMIN_LANG === 'en' && i.name_en) || i.name} ×${i.quantity}</span><span>${money(i.price * i.quantity)}</span></div>`).join('');
  body.innerHTML = `
    <button class="om-close" onclick="closeOrderDetail()">✕</button>
    <h3>${a('orderNumber', o.id)}${o.order_code ? ` · ${o.order_code}` : ''}</h3>
    <div class="om-sub">${o.created_at || ''}</div>
    <div class="om-row"><span class="om-label">${a('thStatus')}</span><span class="status-pill status-${st}">${label}</span></div>
    <div class="om-items">${itemsHtml || `<div>${a('noItems')}</div>`}</div>
    <div class="om-row"><span class="om-label">${a('itemsSum')}</span><span>${money(o.total - (o.delivery_cost || 0))}</span></div>
    ${o.delivery_cost ? `<div class="om-row"><span class="om-label">${a('delivery')}${o.delivery_city ? ' (' + escH((ADMIN_LANG === 'en' && o.delivery_city_en) || o.delivery_city) + ')' : ''}</span><span>${money(o.delivery_cost)}</span></div>` : ''}
    <div class="om-row"><span class="om-label">${a('total')}</span><span><b>${money(o.total)}</b></span></div>
    ${o.promo_code ? `<div class="om-row"><span class="om-label">${a('promoCode')}</span><span>${escH(o.promo_code)} (−${o.discount_percent}%)</span></div>` : ''}
    <div class="om-row"><span class="om-label">${a('thAddress')}</span><span>${escH(o.address || '—')}</span></div>
    <div class="om-row"><span class="om-label">${a('payment')}</span><span>${o.payment_provider || '—'}</span></div>
    <div class="om-row"><span class="om-label">Chat ID</span><span>${o.chat_id}</span></div>
    <div class="om-actions">
      <button onclick="setStatus(${o.id}, 'paid'); closeOrderDetail();">${a('btnPaid')}</button>
      <button onclick="setStatus(${o.id}, 'shipped'); closeOrderDetail();">${a('btnShipped')}</button>
      <button onclick="setStatus(${o.id}, 'delivered'); closeOrderDetail();">${a('btnDelivered')}</button>
      <button class="danger" onclick="setStatus(${o.id}, 'cancelled'); closeOrderDetail();">${a('btnCancel')}</button>
    </div>
  `;
}

function closeOrderDetail() {
  document.getElementById('order-modal-backdrop').classList.remove('show');
}

async function setStatus(id, status) {
  await fetch(`/api/orders/${id}/status`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ status }) });
  loadOrders();
}

async function loadPromos() {
  const table0 = document.getElementById('promos-table');
  if (table0) table0.innerHTML = `<tr><td class="empty">${a('loading')}</td></tr>`;
  const promos = await fetch('/api/promos').then(r => r.json());
  const table = document.getElementById('promos-table');
  if (!promos.length) { table.innerHTML = `<tr><td class="empty">${a('promosEmpty')}</td></tr>`; return; }
  table.innerHTML = `<tr><th>${a('thCode')}</th><th>${a('thDiscount')}</th><th>${a('thUsed')}</th><th>${a('thStatus')}</th><th></th></tr>` +
    promos.map(p => `<tr>
      <td>${p.code}</td>
      <td>${p.discount_percent}%</td>
      <td>${p.used_count}${p.max_uses ? ' / ' + p.max_uses : ' / ∞'}</td>
      <td><span class="status-pill ${p.active ? 'status-paid' : 'status-delivered'}">${p.active ? a('promoActive') : a('promoInactive')}</span></td>
      <td class="row-actions">
        ${p.active
          ? `<button class="danger" onclick="togglePromo('${p.code}', false)">${a('btnDisable')}</button>`
          : `<button onclick="togglePromo('${p.code}', true)">${a('btnEnable')}</button>`}
      </td>
    </tr>`).join('');
}

async function addPromo() {
  const code = document.getElementById('pr-code').value.trim();
  const discount_percent = document.getElementById('pr-percent').value;
  const max_uses = document.getElementById('pr-max').value;
  if (!code || !discount_percent) return toast(a('toastCodeAndPercent'), 'error');
  const res = await fetch('/api/promos', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ code, discount_percent, max_uses: max_uses || null }),
  });
  if (!res.ok) { const err = await res.json(); return toast(err.error || a('toastPromoAddFail'), 'error'); }
  document.getElementById('pr-code').value = '';
  document.getElementById('pr-percent').value = '';
  document.getElementById('pr-max').value = '';
  loadPromos();
}

async function togglePromo(code, active) {
  await fetch(`/api/promos/${encodeURIComponent(code)}/active`, {
    method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ active }),
  });
  loadPromos();
}

async function loadDelivery() {
  const table0 = document.getElementById('delivery-table');
  if (table0) table0.innerHTML = `<tr><td class="empty">${a('loading')}</td></tr>`;
  const { rates, defaultPrice } = await fetch('/api/delivery').then(r => r.json());
  document.getElementById('delivery-default').textContent = a('deliveryDefaultText', money(defaultPrice));
  const table = document.getElementById('delivery-table');
  if (!rates.length) { table.innerHTML = `<tr><td class="empty">${a('deliveryEmpty')}</td></tr>`; return; }
  table.innerHTML = `<tr><th>${a('thCity')}</th><th>${a('thPriceRub')}</th><th>${a('thStatus')}</th><th></th></tr>` +
    rates.map(r => `<tr>
      <td>${r.city}${r.city_en ? `<div class="empty" style="margin:0;">EN: ${r.city_en}</div>` : ''}</td>
      <td><input type="number" min="0" value="${Math.round(r.price / 100)}" onchange="updateDeliveryPrice('${r.city.replace(/'/g, "\\'")}', this.value)"></td>
      <td><span class="status-pill ${r.active ? 'status-paid' : 'status-delivered'}">${r.active ? a('promoActive') : a('promoInactive')}</span></td>
      <td class="row-actions">
        <button onclick="editDeliveryEnglish('${r.city.replace(/'/g, "\\'")}', '${(r.city_en || '').replace(/'/g, "\\'")}')">${a('btnEnglish')}</button>
        ${r.active
          ? `<button class="danger" onclick="toggleDelivery('${r.city}', false)">${a('btnDisable')}</button>`
          : `<button onclick="toggleDelivery('${r.city}', true)">${a('btnEnable')}</button>`}
      </td>
    </tr>`).join('');
}

async function updateDeliveryPrice(city, price) {
  const res = await fetch('/api/delivery', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ city, price }),
  });
  if (!res.ok) { const err = await res.json(); toast(err.error || a('toastPriceSaveFail'), 'error'); }
  loadDelivery();
}

async function addDelivery() {
  const city = document.getElementById('dl-city').value.trim();
  const cityEn = document.getElementById('dl-city-en')?.value.trim() || '';
  const price = document.getElementById('dl-price').value;
  if (!city || !price) return toast(a('toastCityAndPrice'), 'error');
  const res = await fetch('/api/delivery', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ city, city_en: cityEn, price }),
  });
  if (!res.ok) { const err = await res.json(); return toast(err.error || a('toastRateSaveFail'), 'error'); }
  document.getElementById('dl-city').value = '';
  document.getElementById('dl-city-en').value = '';
  document.getElementById('dl-price').value = '';
  loadDelivery();
}

async function editDeliveryEnglish(city, currentCityEn) {
  const cityEn = prompt(a('promptCityEn'), currentCityEn || '');
  if (cityEn === null) return;
  await fetch(`/api/delivery/${encodeURIComponent(city)}/english`, {
    method: 'PUT', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ city_en: cityEn.trim() }),
  });
  toast(a('toastEnglishSaved'), 'ok');
  loadDelivery();
}

async function toggleDelivery(city, active) {
  await fetch(`/api/delivery/${encodeURIComponent(city)}/active`, {
    method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ active }),
  });
  loadDelivery();
}

async function loadAnalytics() {
  const table0 = document.getElementById('analytics-top-table');
  if (table0) table0.innerHTML = `<tr><td class="empty">${a('loading')}</td></tr>`;
  const data = await fetch('/api/analytics').then(r => r.json());
  document.getElementById('an-revenue-today').textContent = money(data.revenue.today);
  document.getElementById('an-revenue-week').textContent = money(data.revenue.week);
  document.getElementById('an-revenue-month').textContent = money(data.revenue.month);
  document.getElementById('an-avg').textContent = data.totalOrders ? money(data.avgOrderValue) : '—';
  document.getElementById('an-orders-count').textContent =
    a('ordersCountText', data.ordersCount.today, data.ordersCount.week, data.ordersCount.month);

  const table = document.getElementById('analytics-top-table');
  if (!data.topProducts.length) { table.innerHTML = `<tr><td class="empty">${a('analyticsEmpty')}</td></tr>`; return; }
  table.innerHTML = `<tr><th>${a('thProduct')}</th><th>${a('thSold')}</th><th>${a('thRevenue')}</th></tr>` +
    data.topProducts.map(p => `<tr>
      <td>${(ADMIN_LANG === 'en' && p.name_en) || p.name}</td>
      <td>${p.qty}</td>
      <td>${money(p.revenue)}</td>
    </tr>`).join('');
}

function tickClock() {
  document.getElementById('clock').textContent = new Date().toLocaleString(a('locale'));
}
tickClock();
setInterval(tickClock, 30000);

applyStaticI18n();
loadProducts();
</script>
